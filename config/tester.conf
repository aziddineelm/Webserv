server {
	listen 8080;
	server_name localhost;
	root YoupiBanane;
	index youpi.bad_extension;
	client_max_body_size 1G;

	location / {
		allowed_methods GET;
		root YoupiBanane;
		index youpi.bad_extension;
	}

	location /youpi.bla {
		allowed_methods POST;
		cgi_extension .bla;
		cgi_path ./cgi_tester;
	}

	location /post_body {
		allowed_methods POST;
		client_max_body_size 100;
	}

	location /directory {
		allowed_methods GET POST;
		root YoupiBanane;
		index youpi.bad_extension;
		cgi_extension .bla;
		cgi_path ./cgi_tester;
	}
}
